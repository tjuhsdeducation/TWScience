    <p><b>How the Punnett Lab works:</b> Each square has 6 steps that unlock in order: 1) tap every clue in the passage ([[clues]] turn green; extra details shake and say they aren’t needed), 2) setup questions, 3) parent genotypes from drop-downs, 4) tap alleles onto the top (Parent 1) and side (Parent 2), 5) fill each box from a genotype palette, 6) ratio questions. After 2 mistakes on a step, a hint appears. Points = steps completed. Students can restart a square with a two-tap “Start over” button.</p>
    <p><b>The crosses (answer key):</b> Lab 1: Pp × pp → 1 Pp : 1 pp, 50% white. Lab 2: Biscuit must be Bb (her white mother could only give b); Bb × Bb → 1 BB : 2 Bb : 1 bb, 3 black : 1 white, 25% white. Snapdragons (incomplete dominance): CᴿCᵂ × CᴿCᵂ → 1 red : 2 pink : 1 white. Hemophilia (X-linked recessive): XᴴXʰ × XᴴY → daughters 0% affected (50% carriers), sons 50% affected, 25% of all children affected.</p>

            <div style="border:3px solid #2b7de9;border-radius:14px;padding:8px 10px"><b>Complete dominance</b><br>One allele hides the other. Pp pea plants look purple, just like PP.</div>
            <div style="border:3px solid #e8368f;border-radius:14px;padding:8px 10px"><b>Incomplete dominance</b><br>The heterozygous phenotype is a <b>blend</b> in between. Red × white snapdragons → <b>pink</b>.</div>
            <div style="border:3px solid #8a54e0;border-radius:14px;padding:8px 10px"><b>Codominance</b><br><b>Both</b> alleles show fully, side by side. Red × white cattle → <b>roan</b> (red AND white hairs). Blood type AB shows both A and B.</div></div>
          <p>Because neither allele is dominant, we don’t use a capital and a lowercase letter. Instead we use one letter with superscripts: <b>Cᴿ</b> (red) and <b>Cᵂ</b> (white).</p>` },

          <p>Some genes are on the <b>X chromosome</b>. Females are <b>XX</b> and males are <b>XY</b>. The Y chromosome does not carry these genes, so a male has only <b>one</b> allele for an X-linked trait.</p>
          <p>We write the allele as a superscript on the X: <b>Xᴴ</b> = normal blood clotting, <b>Xʰ</b> = hemophilia (recessive). A female who is <b>XᴴXʰ</b> is a <b>carrier</b>. A male who is <b>XʰY</b> has hemophilia, because he has no second X to hide the recessive allele.</p>
